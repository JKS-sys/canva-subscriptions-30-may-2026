name: Build & Release Electron App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # removes Node 20 deprecation warning

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-dev libsecret-1-dev dpkg-dev rpm

      - name: Install npm dependencies
        run: npm ci

      # macOS → zip only (no DMG)
      - name: Build Electron app (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac zip --publish never
        env:
          DEBUG: electron-builder
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PASSWORD_HASH: ${{ secrets.PASSWORD_HASH }}

      # Windows / Linux → default targets from package.json
      - name: Build Electron app (Windows / Linux)
        if: runner.os != 'macOS'
        run: npx electron-builder --publish never
        env:
          DEBUG: electron-builder
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PASSWORD_HASH: ${{ secrets.PASSWORD_HASH }}

      - name: Determine release tag
        id: get_tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=nightly-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create tag (for manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag ${{ steps.get_tag.outputs.tag }}
          git push origin ${{ steps.get_tag.outputs.tag }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: dist/*.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
