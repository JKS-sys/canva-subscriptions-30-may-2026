name: Build & Release Electron App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-dev libsecret-1-dev dpkg-dev rpm

      # 🔐 Create .env from secrets (this file will be included in the build)
      - name: Create .env file from secrets
        run: node -e "
          const fs = require('fs');
          const content = 'FIREBASE_SERVICE_ACCOUNT=' + JSON.stringify(process.env.FIREBASE_SERVICE_ACCOUNT) + '\n' +
          'PASSWORD_HASH=' + process.env.PASSWORD_HASH + '\n';
          fs.writeFileSync('.env', content);
          "
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PASSWORD_HASH: ${{ secrets.PASSWORD_HASH }}

      - name: Install npm dependencies
        run: npm ci

      # --- macOS: build unpacked, then ad‑hoc sign & zip ---
      - name: Build Electron app (macOS – unpacked)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dir --publish never
        env:
          DEBUG: electron-builder

      - name: Ad‑hoc sign the macOS .app
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find dist -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH" || echo "Verification not critical"

      - name: Create macOS .zip from signed app (best compression)
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find dist -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found"
            exit 1
          fi
          # Use ditto with best compression (creates a smaller archive than standard zip)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/Canva Tracker-mac.zip"
          echo "Created dist/Canva Tracker-mac.zip"

      # --- Windows & Linux: use default targets from package.json ---
      - name: Build Electron app (Windows / Linux)
        if: runner.os != 'macOS'
        run: npx electron-builder --publish never
        env:
          DEBUG: electron-builder

      - name: Determine release tag
        id: get_tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=nightly-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create tag (for manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag ${{ steps.get_tag.outputs.tag }}
          git push origin ${{ steps.get_tag.outputs.tag }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: dist/*.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
